[pytest]
testpaths = tests
addopts =
    -v
    --strict-markers
    --strict-config
    --alluredir=allure-results
    --clean-alluredir
markers =
    smoke: smoke tests
    regression: regression tests
    ui: ui tests
filterwarnings =
    ignore:.*urllib3.*:DeprecationWarning
    ignore:.*executable_path.*:DeprecationWarning
log_cli = false
